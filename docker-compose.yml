# Local development: `docker compose up -d db mailpit` and run api/web natively (see README).
# Full stack (production-like): `docker compose up -d --build`, then open http://localhost:8338
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mimre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mimre}
      POSTGRES_DB: ${POSTGRES_DB:-mimre}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local mailbox for development: catches all outgoing email (login codes).
  # Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      # The app runs as a restricted role (row-level security applies); migrations create it.
      DATABASE_URL: postgresql+pg8000://mimre_app:${APP_DB_PASSWORD:-mimre_app}@db:5432/${POSTGRES_DB:-mimre}
      ADMIN_DATABASE_URL: postgresql+pg8000://${POSTGRES_USER:-mimre}:${POSTGRES_PASSWORD:-mimre}@db:5432/${POSTGRES_DB:-mimre}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-Mimre <mimre@localhost>}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      # Only reachable from this machine. In production, Cloudflare Tunnel reaches the
      # container over Docker's network, so the port doesn't need to be published at all.
      - "127.0.0.1:${WEB_PORT:-8338}:80"
    depends_on:
      - api

volumes:
  db-data:
